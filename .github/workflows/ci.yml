name: CI

on:
  push:
    branches: [main, develop, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # TypeScript : typecheck + build
  # ─────────────────────────────────────────────
  typescript:
    name: TypeScript (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build @beacon/api 
        run: pnpm --filter "@beacon/api" build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Build
        run: pnpm -r build

  # ─────────────────────────────────────────────
  # Python (ingestion) — tests unitaires
  # ─────────────────────────────────────────────
  python-ingestion:
    name: Python (ingestion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ingestion/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r services/ingestion/requirements-dev.txt

      - name: Run unit tests
        # cd dans le dossier du service — résout les imports relatifs
        working-directory: services/ingestion
        run: python -m pytest tests/unit/ -v --tb=short

  # ─────────────────────────────────────────────
  # Python (processor) — tests unitaires
  # ─────────────────────────────────────────────
  python-processor:
    name: Python (processor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/processor/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r services/processor/requirements-dev.txt

      - name: Run unit tests
        working-directory: services/processor
        run: python -m pytest tests/ -v --tb=short

  # ─────────────────────────────────────────────
  # Python (ai) — tests unitaires
  # ─────────────────────────────────────────────
  python-ai:
    name: Python (ai)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai/requirements-dev.txt

      - name: Install dependencies
        run: pip install "--only-binary=:all:" -r services/ai/requirements-dev.txt

      - name: Run unit tests
        working-directory: services/ai
        env:
          GEMINI_API_KEY: test
        run: python -m pytest tests/ -v --tb=short

  # ─────────────────────────────────────────────
  # Temporal : workflow tests (time-skipping)
  # ─────────────────────────────────────────────
  temporal:
    name: Temporal (workflow tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run workflow tests
        run: pnpm --filter "@beacon/temporal" test

  # ─────────────────────────────────────────────
  # Security : scan des secrets
  # ─────────────────────────────────────────────
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy — scan filesystem
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 0
          ignore-unfixed: true

  # ─────────────────────────────────────────────
  # E2E : Playwright (docker-compose full stack)
  # ─────────────────────────────────────────────
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [typescript, python-ingestion, python-processor]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Playwright browsers
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Start full stack
        run: docker compose --profile full up -d

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for ClickHouse..."
          timeout 120 bash -c 'until curl -sf http://localhost:8123/ping; do sleep 2; done'
          echo "Waiting for Ingestion API..."
          timeout 120 bash -c 'until curl -sf http://localhost:8000/health; do sleep 2; done'
          echo "Waiting for Next.js..."
          timeout 120 bash -c 'until curl -sf http://localhost:3000; do sleep 2; done'

      - name: Seed databases
        run: |
          # PostgreSQL — create tenants table + insert test tenant
          # SHA-256 of 'test-api-key'
          docker compose exec -T postgres psql -U beacon -d beacon -c "
            CREATE TABLE IF NOT EXISTS tenants (
              id            VARCHAR(64)  PRIMARY KEY,
              name          VARCHAR(256) NOT NULL,
              api_key_hash  VARCHAR(64)  NOT NULL,
              plan          VARCHAR(32)  DEFAULT 'free',
              is_active     BOOLEAN      DEFAULT TRUE,
              created_at    TIMESTAMP    DEFAULT NOW()
            );
            CREATE INDEX IF NOT EXISTS ix_tenants_api_key_hash ON tenants(api_key_hash);
            INSERT INTO tenants (id, name, api_key_hash, plan, is_active) VALUES
              ('acme-corp', 'Acme Corporation', '4c806362b613f7496abf284146efd31da90e4b16169fe001841ca17290f427c4', 'enterprise', true),
              ('beta-inc',  'Beta Inc',         '4c806362b613f7496abf284146efd31da90e4b16169fe001841ca17290f427c4', 'pro',        true),
              ('gamma-llc', 'Gamma LLC',        '4c806362b613f7496abf284146efd31da90e4b16169fe001841ca17290f427c4', 'free',       true)
            ON CONFLICT (id) DO NOTHING;
          "
          # ClickHouse — seed events + health scores
          docker compose exec -T clickhouse \
            clickhouse-client --user beacon --password beacon --database beacon \
            < clickhouse/seeds/seed_test_data.sql

      - name: Run E2E tests
        working-directory: tests
        env:
          BASE_URL: http://localhost:3000
          API_URL:  http://localhost:8000
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7

  # ─────────────────────────────────────────────
  # Docker : build des images (services existants uniquement)
  # ─────────────────────────────────────────────
  docker-build:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ingestion, processor, ai]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
