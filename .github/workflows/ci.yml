name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # TypeScript : typecheck + build
  # ─────────────────────────────────────────────
  typescript:
    name: TypeScript (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Build
        run: pnpm -r build

  # ─────────────────────────────────────────────
  # Python (ingestion) — tests unitaires
  # ─────────────────────────────────────────────
  python-ingestion:
    name: Python (ingestion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ingestion/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r services/ingestion/requirements-dev.txt

      - name: Run unit tests
        # cd dans le dossier du service — résout les imports relatifs
        working-directory: services/ingestion
        run: python -m pytest tests/unit/ -v --tb=short

  # ─────────────────────────────────────────────
  # Python (processor) — tests unitaires
  # ─────────────────────────────────────────────
  python-processor:
    name: Python (processor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/processor/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r services/processor/requirements-dev.txt

      - name: Run unit tests
        working-directory: services/processor
        run: python -m pytest tests/ -v --tb=short

  # ─────────────────────────────────────────────
  # Security : scan des secrets
  # ─────────────────────────────────────────────
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy — scan filesystem
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 0
          ignore-unfixed: true

  # ─────────────────────────────────────────────
  # Docker : build des images (services existants uniquement)
  # ─────────────────────────────────────────────
  docker-build:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Ajouter 'ai' quand le service sera implémenté (M07)
        service: [ingestion, processor]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
